# PROD: the gsb Postgres the vendor parser's [refdata] uses
# (unified_parser/deploy/kustomize/vendor/overlays/prod/sink-vendor-direct.toml).
# Read after migrate.conf; anything set here wins.
# The password is NOT kept here: export PGPASSWORD or use ~/.pgpass.

# Not set in the parser's prod config yet either: fill in from the prod
# gsb Postgres (the same host and user as the parser's [refdata]). The
# prod DuckLake metadata Postgres is 172.24.9.234; on DEV and UAT the gsb
# database is on the same host as DuckLake's, but confirm it for PROD.
# migrate.sh refuses to run while these still read REPLACE_WITH_...
PG_HOST="REPLACE_WITH_GSB_PG_HOST"
PG_PORT="5432"
PG_DATABASE="gsb"
PG_USER="REPLACE_WITH_GSB_PG_USER"
# Time zone the source timestamps are read in (empty = server default).
PG_TIMEZONE=""

# COUNTER_DEF_V2 already has the parser's rows: drop and recreate it.
DROP_EXISTING_COUNTER_DEF_V2="true"
