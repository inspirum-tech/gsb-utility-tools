# UAT: the gsb Postgres the vendor parser's [refdata] uses
# (unified_parser/deploy/kustomize/vendor/overlays/uat/sink-vendor-direct.toml).
# Read after migrate.conf; anything set here wins.
# The password is NOT kept here: export PGPASSWORD or use ~/.pgpass.

PG_HOST="10.201.170.205"
PG_PORT="5432"
PG_DATABASE="gsb"
PG_USER="postgres"
# Time zone the source timestamps are read in (empty = server default).
PG_TIMEZONE=""

# COUNTER_DEF_V2 already has the parser's rows: drop and recreate it.
DROP_EXISTING_COUNTER_DEF_V2="true"
