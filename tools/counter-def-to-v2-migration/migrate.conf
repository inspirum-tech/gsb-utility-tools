# COUNTER_DEF -> COUNTER_DEF_V2 migration settings shared by every
# environment (read by migrate.sh). Each environment's own values (the
# connection, DROP_EXISTING_COUNTER_DEF_V2) are in env/<env>.conf, which is
# read after this file and wins. Defaults follow the counter parser
# (unified_parser [refdata] / [arrays]).
# Plain bash syntax: NAME="value", no spaces around '='.

# -- COUNTER_DEF (source, read only) ----------------------------------
COUNTER_DEF_SCHEMA="gsb_data"
COUNTER_DEF_TABLE="COUNTER_DEF"
# Column holding the Java counter name; restored to the raw XML name.
COUNTER_DEF_NAME_COLUMN="COUNTER_NAME"
# Optional column with identity attributes (JSON). Empty = '{}'.
COUNTER_DEF_ATTRIBUTES_COLUMN=""
# Only rows of these vendors are migrated (comma separated).
# Empty = every vendor in COUNTER_DEF.
VENDORS=""

# -- MEASUREMENT_DEF (source, read only) ------------------------------
# Gives the measurement name Java put in front of the counter name.
MEASUREMENT_DEF_SCHEMA="gsb_data"
MEASUREMENT_DEF_TABLE="MEASUREMENT_DEF"
# Vendors whose Java COUNTER_NAME is "<MEASUREMENT_NAME>_<raw name>"
# (Java useQualifiedCounterName = Y). Empty = no prefix removal.
MEASUREMENT_PREFIX_VENDORS="ERS"

# -- ERS_COUNTER_DEF (source, read only) ------------------------------
# Array counter sizes and separators (parser [arrays] metadata_tables).
ERS_COUNTER_DEF_SCHEMA="gsb_data"
ERS_COUNTER_DEF_TABLE="ERS_COUNTER_DEF"
# Vendors whose array counters are in ERS_COUNTER_DEF. Empty = no array bins.
ERS_COUNTER_DEF_VENDORS="ERS"

# -- COUNTER_DEF_V2 (the only table written) --------------------------
# The parser reads [refdata] schema . COUNTER_DEF_V2: keep these as the
# parser has them for the real run.
COUNTER_DEF_V2_SCHEMA="gsb_data"
COUNTER_DEF_V2_TABLE="COUNTER_DEF_V2"
COUNTER_DEF_V2_SEQUENCE="counter_def_v2_counter_id_seq"
COUNTER_DEF_V2_INDEX="UX_COUNTER_DEF_V2_IDENTITY"
# COUNTER_DEF_V2 already exists with rows:
#   false = stop, change nothing;
#   true  = drop it (with its index) and recreate it, in the same
#           transaction. The COUNTER_ID sequence is kept.
DROP_EXISTING_COUNTER_DEF_V2="true"

# -- Column mapping ---------------------------------------------------
# Columns copied from COUNTER_DEF: DEST or DEST=SOURCE, comma separated.
# COUNTER_NAME, ATTRIBUTES and SUB_COUNTER are derived; never list them.
# COUNTER_ID, VENDOR and MEASUREMENT_ID are required.
COPY_COLUMNS="COUNTER_ID,VERSION,VENDOR,MEASUREMENT_ID,FRIENDLY_NAME,
VALUE_TYPE,TECHNOLOGY,OBJ_LEVEL,TIME_RESOLUTION,ENABLED,AGG_OP,
DESC_COUNTER_NAME,MOCN_NAME,APPLICATION,FIRST_SEEN_DATE,
LAST_UPDATED_DATE,LAST_UPDATED_BY"

# Copied columns whose NULLs are filled with the run time (the
# destination requires a value). Comma separated, destination names.
FILL_NULL_WITH_RUN_TIME="FIRST_SEEN_DATE"

# COUNTER_DEF's TIME_RESOLUTION letter -> the parser's value
# (unified_parser src/gsb/java.rs). Shortest period first: a value with
# several letters keeps this order, as the parser does. A letter not
# listed stops the run. Empty = copy TIME_RESOLUTION unchanged.
TIME_RESOLUTION_MAP="M=MNLY,F=FIVE,T=TEN,Q=QRLY,H=HRLY,D=DALY"

# -- Output -----------------------------------------------------------
# Each run writes its log and CSV reports to a new folder under here.
REPORT_DIR="./reports"
