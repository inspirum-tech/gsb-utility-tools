# Dev config for publish_parser_trigger.py
# Per-vendor keys use the prefix ers_ / nsn_ / hw_ and override the shared key of the same name.
# {vendor} is replaced with ERS / NSN / HW.

# Root of the parser input queue (same as file finder output_base_path)
input_base_path=/mnt/mfs/gsb_data/parser-input-queue

upload_block_time_increment_in_minute=15

# wait between published messages (seconds); 0 = publish all at once. Not applied to empty blocks or --dry-run
publish_interval_seconds=120

# ---- Vendors (all enabled by default; set to false to skip) ----
ers_enabled=true
ers_start_time=2026-10-25 00:00:00
# optional, inclusive start of the last block; when not set, runs to the last block of the latest date folder
#ers_end_time=2025-10-25 23:45:00

nsn_enabled=true
nsn_start_time=2025-09-15 00:00:00
#nsn_end_time=

hw_enabled=true
hw_start_time=2025-09-18 00:00:00
#hw_end_time=

# ---- NATS (same values the file finder / parser use) ----
nats_servers=nats://192.168.50.218:4222
nats_stream_name=parser_raw_input_{vendor}
nats_stream_subject=parser.raw.input.{vendor}
# only used if the stream has to be created
message_retention_in_hours=168
nats_stream_num_replicas=1

# info | debug (debug also logs each skipped empty block)
log_level=info
