# Prod config for publish_parser_trigger.py (template - review servers/paths/times before use)
# In prod the file finder normally publishes these messages; use this only for manual replays.
# Per-vendor keys use the prefix ers_ / nsn_ / hw_ and override the shared key of the same name.

input_base_path=/mnt/mfs/gsb_data/parser-input-queue

upload_block_time_increment_in_minute=15

# wait between published messages (seconds); 0 = publish all at once. Not applied to empty blocks or --dry-run
publish_interval_seconds=120

ers_enabled=true
ers_start_time=2025-10-25 00:00:00
#ers_end_time=

nsn_enabled=true
nsn_start_time=2025-09-15 00:00:00
#nsn_end_time=

hw_enabled=true
hw_start_time=2025-09-18 00:00:00
#hw_end_time=

nats_servers=nats://10.201.170.198:4222,nats://10.201.170.199:4222,nats://10.201.170.200:4222,nats://10.201.170.201:4222,nats://10.201.170.202:4222,nats://10.201.170.203:4222,nats://10.201.170.204:4222
nats_stream_name=parser_raw_input_{vendor}
nats_stream_subject=parser.raw.input.{vendor}
message_retention_in_hours=168
nats_stream_num_replicas=3

log_level=info
